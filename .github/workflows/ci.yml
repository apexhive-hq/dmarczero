name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify single-document lockfiles
        run: |
          test "$(grep -c '^---$' pnpm-lock.yaml || true)" -eq 0
          test "$(grep -c '^---$' cloudflare-worker/pnpm-lock.yaml || true)" -eq 0

  verify-cli:
    needs: verify-lockfiles
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install, typecheck, build, and test core CLI
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run typecheck
          pnpm run build
          pnpm test

  verify-worker:
    needs: verify-lockfiles
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: cloudflare-worker/pnpm-lock.yaml

      - name: Install, typecheck, test, and dry-run Cloudflare Worker
        working-directory: cloudflare-worker
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run typecheck
          pnpm test
          pnpm exec wrangler deploy --dry-run --outdir dist
          rm -rf dist .wrangler-state .dev.vars
