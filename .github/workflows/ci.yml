name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Verify single-document lockfiles
        run: |
          test "$(grep -c '^---$' pnpm-lock.yaml || true)" -eq 0
          test "$(grep -c '^---$' cloudflare-worker/pnpm-lock.yaml || true)" -eq 0

      - name: Install, typecheck, build, and test core CLI
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run typecheck
          pnpm run build
          pnpm test

      - name: Install, typecheck, test, and dry-run Cloudflare Worker
        working-directory: cloudflare-worker
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run typecheck
          pnpm test
          pnpm exec wrangler deploy --dry-run --outdir dist
          rm -rf dist .wrangler-state .dev.vars
