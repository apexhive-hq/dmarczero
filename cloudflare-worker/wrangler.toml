name = "dmarczero-worker"
main = "src/index.ts"
compatibility_date = "2025-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
MONITORED_DOMAINS = ""
ALLOW_UNLISTED_DOMAINS = "false"
ALLOWED_ORIGINS = ""
PASS_RATE_ALERT_THRESHOLD = "90"
# Optional comma-separated extra HTTPS webhook hostnames beyond Discord/Slack/Telegram:
# WEBHOOK_ALLOWLIST = ""

# Configure secrets via Wrangler (never commit secrets here):
# wrangler secret put DASHBOARD_ADMIN_TOKEN
# wrangler secret put ALERT_WEBHOOK_URL
# wrangler secret put TELEGRAM_CHAT_ID

[triggers]
crons = ["0 2 * * *"]

[[durable_objects.bindings]]
name = "DMARC_STORE"
class_name = "DmarcStoreDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DmarcStoreDO"]
